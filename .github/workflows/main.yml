name: Build HyperTheme-Fix APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KSP and Inject xposed_init
        run: |
          ./gradlew kspDebugKotlin --no-daemon
          mkdir -p app/src/main/assets
          FOUND_INIT=$(find app/build -name "xposed_init" | head -n 1)
          if [ -n "$FOUND_INIT" ]; then
            cp "$FOUND_INIT" app/src/main/assets/xposed_init
            echo "Berhasil menyalin xposed_init dari $FOUND_INIT:"
            cat app/src/main/assets/xposed_init
          else
            echo "File xposed_init tidak ditemukan dari KSP, membuat manual..."
            ENTRY_CLASS=$(grep -rn "@InjectYukiHookWithXposed" app/src/main/java | sed -E 's/.*package ([^;]+).*/\1/' | head -n 1)
            echo "com.chendusk.hyperthemehk.hook.HookEntry_YukiHookXposedInit" > app/src/main/assets/xposed_init
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperTheme-Fix-With-Assets
          path: app/build/outputs/apk/debug/*.apk
