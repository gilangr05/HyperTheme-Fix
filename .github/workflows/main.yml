name: Build HyperTheme-Fix APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Xposed Meta-Data & Assets
        run: |
          ./gradlew kspDebugKotlin --no-daemon

          if ! grep -q "xposedmodule" app/src/main/AndroidManifest.xml; then
            sed -i 's|</application>|    <meta-data android:name="xposedmodule" android:value="true" />\n        <meta-data android:name="xposeddescription" android:value="HyperTheme Fix" />\n        <meta-data android:name="xposedminversion" android:value="93" />\n    </application>|g' app/src/main/AndroidManifest.xml
          fi

          mkdir -p app/src/main/assets
          FOUND_INIT=$(find app/build -name "xposed_init" | head -n 1)
          if [ -n "$FOUND_INIT" ]; then
            cp "$FOUND_INIT" app/src/main/assets/xposed_init
          else
            echo "com.chendusk.hyperthemehk.hook.HookEntry_YukiHookXposedInit" > app/src/main/assets/xposed_init
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperTheme-Fix-Final
          path: app/build/outputs/apk/debug/*.apk
